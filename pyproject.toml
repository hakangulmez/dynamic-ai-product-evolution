[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dynamic-ai-product-evolution"
version = "0.3.0"
description = "Longitudinal product-capability-task data for the frontier-LLM transition"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.8",
  "pandas>=2.2",
  "pyyaml>=6.0",
  "tenacity>=8.2",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.5",
  "mypy>=1.10",
  "jsonschema>=4.23",
]
notebook = [
  "jupyterlab>=4.2",
  "ipykernel>=6.29",
  "nbformat>=5.10",
]
ui = [
  "streamlit>=1.42",
]

[project.scripts]
dape = "dynamic_ai_products.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/dynamic_ai_products"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
